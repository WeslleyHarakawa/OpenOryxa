<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenOryxa Chat</title>
<style>
:root { --bg: #0d1024; --panel: #161a3a; --border: #2a2f5a; --text: #e8eaff; --muted: #8a90b8; --accent: #6c5dff; --you: #6c5dff; --them: #1c2148; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: ui-sans-serif, system-ui, sans-serif; }
.app { display: flex; flex-direction: column; height: 100vh; max-width: 760px; margin: 0 auto; }
.header { padding: 14px 18px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.header h1 { margin: 0; font-size: 16px; font-weight: 600; }
.header .meta { color: var(--muted); font-size: 12px; }
.spacer { flex: 1; }
.btn { background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
.btn:hover { color: var(--text); border-color: var(--accent); }
.log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; line-height: 1.4; white-space: pre-wrap; word-wrap: break-word; }
.msg.you { align-self: flex-end; background: var(--you); color: #fff; border-bottom-right-radius: 4px; }
.msg.them { align-self: flex-start; background: var(--them); border-bottom-left-radius: 4px; }
.msg .time { font-size: 11px; opacity: 0.6; margin-top: 4px; }
.typing { align-self: flex-start; color: var(--muted); font-size: 13px; padding: 8px 14px; }
.composer { padding: 12px; background: var(--panel); border-top: 1px solid var(--border); display: flex; gap: 8px; }
.composer textarea { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; font: inherit; font-size: 14px; resize: none; min-height: 44px; max-height: 160px; }
.composer textarea:focus { outline: none; border-color: var(--accent); }
.composer button { background: var(--accent); color: #fff; border: 0; border-radius: 12px; padding: 0 18px; font-weight: 600; cursor: pointer; }
.composer button:disabled { opacity: 0.5; cursor: not-allowed; }
.error { color: #ff6b8a; font-size: 13px; padding: 6px 14px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1 id="title">OpenOryxa</h1>
    <div class="meta" id="meta"></div>
    <div class="spacer"></div>
    <button class="btn" id="reset">Limpar</button>
  </div>
  <div class="log" id="log"></div>
  <div class="error" id="error"></div>
  <div class="composer">
    <textarea id="input" placeholder="Mensagem… (Enter para enviar, Shift+Enter quebra linha)" autofocus></textarea>
    <button id="send">Enviar</button>
  </div>
</div>
<script>
const params = new URLSearchParams(location.search);
const name = params.get('name');
if (!name || !/^[a-z0-9-]{2,40}$/.test(name)) {
  document.body.innerHTML = '<p style="padding:30px;color:#ff6b8a">Falta ?name=<instancia> na URL.</p>';
  throw new Error('no name');
}

const titleEl = document.getElementById('title');
const metaEl = document.getElementById('meta');
const logEl = document.getElementById('log');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const errorEl = document.getElementById('error');
const resetBtn = document.getElementById('reset');

titleEl.textContent = name;
let providerLabel = '';

function fmtTime(d) {
  return d.toTimeString().slice(0, 5);
}

function addMsg(role, text, ms) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'you' : 'them');
  div.textContent = text;
  if (ms) {
    const t = document.createElement('div');
    t.className = 'time';
    t.textContent = fmtTime(new Date()) + ' · ' + ms + 'ms' + (providerLabel ? ' · ' + providerLabel : '');
    div.appendChild(t);
  }
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typing';
  div.textContent = 'digitando…';
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}
function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

async function loadHistory() {
  try {
    const r = await fetch('/api/instances/' + encodeURIComponent(name) + '/chat-fast/history', { credentials: 'same-origin' });
    if (r.status === 401) { location.href = '/'; return; }
    if (!r.ok) return;
    const j = await r.json();
    for (const h of (j.history || [])) addMsg(h.role === 'assistant' ? 'assistant' : 'user', h.content, null);
  } catch {}
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || sendBtn.disabled) return;
  errorEl.textContent = '';
  inputEl.value = '';
  sendBtn.disabled = true;
  addMsg('user', text, 0);
  addTyping();
  try {
    const r = await fetch('/api/instances/' + encodeURIComponent(name) + '/chat-fast', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    removeTyping();
    if (r.status === 401) { location.href = '/'; return; }
    const j = await r.json();
    if (!r.ok) {
      errorEl.textContent = 'Erro: ' + (j.error || r.statusText);
    } else {
      providerLabel = (j.provider || '') + (j.model ? ' (' + j.model + ')' : '');
      metaEl.textContent = providerLabel;
      addMsg('assistant', j.reply || '(sem resposta)', j.ms);
    }
  } catch (e) {
    removeTyping();
    errorEl.textContent = 'Falha de rede: ' + e.message;
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.addEventListener('click', send);
resetBtn.addEventListener('click', async () => {
  if (!confirm('Limpar conversa?')) return;
  await fetch('/api/instances/' + encodeURIComponent(name) + '/chat-fast', {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: '.', reset: true }),
  }).catch(() => {});
  logEl.innerHTML = '';
});

loadHistory();
</script>
</body>
</html>
